version: '3.4'

services:

  api:
    image: __APP_NAME__
    container_name: flask-api
    ports:
      - "80:80"
    env_file:
      - .env

  worker:
    image: __APP_NAME__
    container_name: flask-worker
    command: celery -A src.__APP_NAME__.worker.tasks worker --loglevel=info
    env_file:
      - .env

  queue:
    image: redis:4
    container_name: flask-queue
    expose:
      - "6379"
